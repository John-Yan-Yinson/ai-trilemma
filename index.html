<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The AI Trilemma</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#F4F3FF;--dim:#B3B1D8;--navy:#1C1B45}
*{box-sizing:border-box}
html{background:var(--navy)}
body{margin:0;color:var(--ink);font:16px/1.45 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(bg.jpg) center/cover no-repeat}
@media (orientation:portrait){body::before{background-image:url(bg-mobile.jpg)}}
.wrap{max-width:520px;margin:0 auto;padding:24px 18px}.wide{max-width:1240px}
h1,h2{margin:.2em 0}p{color:var(--dim)}b{color:var(--ink)}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;margin:6px 0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;margin:6px 0;color-scheme:dark}
select option{background:#1C1B45;color:var(--ink)}
.rnote{color:var(--dim);font-size:14px;margin:6px 0}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--ink);padding:9px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button:hover{background:rgba(255,255,255,.17)}
button.go{background:var(--ink);color:var(--navy);font-weight:800;border-color:var(--ink);width:100%;padding:13px;margin-top:6px}
.err{color:#ffb3b3;min-height:1.2em;margin:0}li{margin:6px 0}

/* glass + neon boxes */
.col,.vc,.rb,.mv{background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid rgba(var(--rgb,255,255,255),.85);border-radius:18px;box-shadow:0 0 14px rgba(var(--rgb,255,255,255),.38),inset 0 0 22px rgba(var(--rgb,255,255,255),.08)}
.mv{border-color:rgba(255,255,255,.3);box-shadow:none;padding:14px;font-size:18px;margin-top:14px}

/* phone pickers */
.jl{color:var(--dim);font-size:13px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.05em}
.pk{display:grid;gap:12px;margin-top:14px}
.pk button{padding:22px;font-size:20px;font-weight:800;border:1.5px solid var(--c);color:var(--c);background:rgba(255,255,255,.05);box-shadow:0 0 14px rgba(var(--rgb),.4),inset 0 0 18px rgba(var(--rgb),.08);text-shadow:0 0 10px rgba(var(--rgb),.5)}
.pk button:disabled{cursor:default}.pk.locked button:not(.on){opacity:.3}.lockn{color:var(--dim);margin:12px 0 0}
.pk button.on{background:var(--c);color:var(--navy);text-shadow:none;box-shadow:0 0 24px rgba(var(--rgb),.75)}

/* host bar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs button.on{background:var(--ink);color:var(--navy);font-weight:700}
.jn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.jn span{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:var(--dim)}
.jn span.on{background:var(--ink);color:var(--navy);border-color:var(--ink);font-weight:800}
.qr{background:#fff;padding:12px;border-radius:12px;width:max-content;margin:0 auto 16px}

/* live columns */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{display:flex;flex-direction:column;min-height:62vh;overflow:hidden}
.col h3{margin:0;padding:14px;text-align:center;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);text-shadow:0 0 12px rgba(var(--rgb),.6)}
.sec{padding:14px;border-top:1px solid rgba(var(--rgb,255,255,255),.25)}.sec small{color:var(--dim)}
.mid{flex:1;font-size:18px}.mid ul{margin:0;padding-left:20px}
.num{font-size:44px;font-weight:800;line-height:1.1;color:var(--c,var(--ink))}.d{font-size:18px;margin-left:10px;color:var(--ink)}

/* vote */
.vcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
.vc{padding:20px;cursor:pointer;text-align:center}.vc.out{opacity:.4;border-style:dashed}
.vc h3{margin:0 0 8px;font-size:22px}.vc small{color:var(--dim)}.vc .num{color:var(--ink)}
.tag{margin-top:10px;font-weight:800;letter-spacing:.06em;font-size:13px}

/* results */
.rs{margin:0 0 20px}.rh{margin:0 0 10px;font-size:20px;letter-spacing:.02em}
.rboxes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:12px}
.rb{padding:12px 20px}
.rt{font-weight:800;font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);text-shadow:0 0 10px rgba(var(--rgb),.55);text-align:center;margin-bottom:6px}
.rr{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:3px 0}.rr b{color:inherit}
.big{font-size:40px;font-weight:800;text-align:center;color:var(--c);text-shadow:0 0 12px rgba(var(--rgb),.5);line-height:1.15}
.rsub{text-align:center;color:var(--dim)}
.tr{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;margin:6px 0}.tl{font-size:15px;color:var(--dim)}
.sb{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05)}
.sb span{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);overflow:hidden}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 0 14px;font-size:14px;color:var(--dim)}
.dl{font-size:14px;margin:4px 0 0}.dl span{white-space:nowrap}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.tp{margin:6px 0 4px}.tp summary{cursor:pointer;color:var(--dim);padding:6px 0}
.tpp{margin:8px 0}.tpp b{color:inherit}.tpp ul{margin:4px 0 0;padding-left:20px}.tpp li{color:var(--ink);margin:3px 0}
.lk{background:none;border:none;color:var(--dim);text-decoration:underline;padding:8px 0;margin-top:14px;-webkit-backdrop-filter:none;backdrop-filter:none}
@media(max-width:760px){.cols,.vcards,.rboxes{grid-template-columns:1fr}.tr{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,deleteDoc,deleteField,onSnapshot,collection,addDoc,getDocs,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG={apiKey:"AIzaSyASMLP6fIP2U4COqCR_AYJHmBe19DhVuqc",authDomain:"oyw---ai-trilemma-workshop.firebaseapp.com",projectId:"oyw---ai-trilemma-workshop",storageBucket:"oyw---ai-trilemma-workshop.firebasestorage.app",messagingSenderId:"380446389895",appId:"1:380446389895:web:6d1d97f281a14602c42a22"};

const db=getFirestore(initializeApp(CONFIG)),sref=c=>doc(db,'sessions',c);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// pillar colours (order here = order on screen). rgb is the same colour for the glow effects.
const P=[
  {id:'profit',n:'Profit',c:'#FFF7A3',rgb:'255,247,163'},
  {id:'planet',n:'Planet',c:'#86D1AB',rgb:'134,209,171'},
  {id:'people',n:'People',c:'#FF7AC9',rgb:'255,122,201'}];
const pn=id=>P.find(p=>p.id===id);
const pstyle=p=>`--c:${p.c};--rgb:${p.rgb}`;
// Wording used across the screens. Change it here to rename it everywhere.
const T={g:'Value Compass',as:'Assigned to speak',a:'After discussion',pt:'talking point'};
const ROLES=[{id:'sus',n:'Sustainability & Environment'},{id:'ppl',n:'People, HR & Social Impact'},{id:'fin',n:'Finance & Strategy'},{id:'tech',n:'Technology & Data'},{id:'ops',n:'Operations & Engineering'},{id:'pol',n:'Policy, Legal & Government'},{id:'biz',n:'Business & Entrepreneurship'},{id:'stu',n:'Student & Research'},{id:'oth',n:'Other / prefer not to say'}];
const MIN_GROUP=3; // a role group is only shown when at least this many people are in it
const JN=['Choose a pillar','Set the scene','Test and challenge','Reconsider your pillar','Conclusion'];
const JMAP={lobby:[],ground:[1],scene:[2],internal:[3],external:[3],reselect:[4],results:[5]};
const DEF=`The Hospital AI roll-out | Faster diagnoses and shorter waits, versus missed rare cases and fewer frontline staff.
The Green Data Centre Dilemma | Expand fast with a conventional data centre, or go sustainable at higher cost and a slower start.`;
// minutes per stage (host timer). Introduction 7 · each scenario 18 = 2+4+11+1 · Conclusion / Debrief 5 · total 48
const MINS={lobby:0,ground:7,scene:2,internal:4,external:11,reselect:1,results:5};
const STEPS=[{k:'lobby'},{k:'ground'}];
[0,1].forEach(n=>STEPS.push({k:'scene',n},{k:'internal',n},{k:'external',n},{k:'reselect',n}));
STEPS.push({k:'results'});
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

const host=location.hash==='#host';
const pid=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2,10));
const openTp=new Set();
let S=null,code=null,players=[],points=[],me={},mineAll=[],loaded=false,tab=null,hide=false,timerEnd=0,lastStep=-1,plLoaded=false,ptLoaded=false,pubStep=-1,lockSent=-1;
const cur=()=>STEPS[S.step];
// Stages where people choose a pillar. When the host's timer hits 0:00 these lock for everyone.
const LOCKABLE=['ground','scene','reselect'];
const locked=()=>!!S&&S.lockedStep===S.step&&LOCKABLE.includes(cur().k);
const lockNote=()=>locked()?'<p class="lockn">⏱ Time\'s up. Your response is locked in.</p>':'';
// What the host writes when moving to another step: new step, a fresh shared deadline, and any old lock cleared
const stepUpdate=ns=>{const m=MINS[STEPS[ns].k];return{step:ns,lockedStep:deleteField(),deadline:m?Date.now()+m*60000:deleteField()}};
const cnt=(k,id)=>players.filter(x=>x[k]===id).length;
const lab=s=>({lobby:'Introduction',ground:'Introduction',scene:`S${s.n+1} · Set the scene`,internal:`S${s.n+1} · Pillar huddle`,external:`S${s.n+1} · Cross-pillar exchange`,reselect:`S${s.n+1} · Reconsider`,results:'Conclusion / Debrief'})[s.k];

function listen(c){
  code=c;loaded=false;
  onSnapshot(sref(c),d=>{S=d.exists()?d.data():null;loaded=true;draw()});
  if(host){
    onSnapshot(collection(db,'sessions',c,'players'),q=>{players=q.docs.map(d=>d.data());plLoaded=true;draw()});
    onSnapshot(collection(db,'sessions',c,'points'),q=>{points=q.docs.map(d=>d.data()).sort((a,b)=>a.at-b.at);ptLoaded=true;draw()});
  }else{
    localStorage.lastCode=c;
    onSnapshot(doc(db,'sessions',c,'players',pid),d=>{me=d.data()||{};draw()});
    onSnapshot(query(collection(db,'sessions',c,'points'),where('pid','==',pid)),q=>{mineAll=q.docs.map(d=>d.data()).sort((a,b)=>a.at-b.at);draw()});
  }
}
const draw=()=>host?drawHost():drawPlayer();

/* ---------- PARTICIPANT ---------- */
const picker=k=>`<div class="pk${locked()?' locked':''}">${P.map(p=>`<button ${locked()?'disabled ':''}data-set="${k}:${p.id}" class="${me[k]===p.id?'on':''}" style="${pstyle(p)}">${p.n}</button>`).join('')}</div>`;
const roleSelect=()=>`<select id="role" aria-label="Your role"><option value="">Choose your role…</option>${ROLES.map(r=>`<option value="${r.id}" ${me.role===r.id?'selected':''}>${esc(r.n)}</option>`).join('')}</select>`;
const rolePrompt=()=>`<div class="mv" style="margin:18px 0 0;padding:12px 14px"><p style="margin:0 0 2px">Quick one, optional: what kind of work do you do?</p>${roleSelect()}</div>`;
function drawPlayer(){
  const W=h=>app.innerHTML=`<div class="wrap">${h}</div>`;
  if(!code)return W(`<h1>Join the session</h1><input id="cd" placeholder="Session code" maxlength="4" autocapitalize="characters"><button class="go" data-a="join">Join</button>`);
  if(!loaded)return W('<p>Connecting…</p>');
  if(!S)return W('<h1>Session not found</h1><p>Check the code and try again.</p><button class="lk" data-a="forget">Try a different code</button>');
  if(S.ended&&!S.results)return W("<h1>Session ended 🙌</h1><p>Thanks for taking part — look at the big screen for the room's results.</p>");
  const st=cur(),i=st.n===undefined?null:st.n,sc=(i!==null&&S.scenarios[i])||{};
  if(S.results&&(S.ended||st.k==='results')){
    const g=me.g?pn(me.g):null;
    app.innerHTML=`<div class="wrap" style="max-width:760px"><h1>Thank you 🙌</h1><p>Your ${T.g}: <b style="color:${g?g.c:'inherit'}">${g?g.n:'—'}</b></p><p>Your stance may shift from one scenario to the next, depending on context. Your ${T.g} is what you carry with you.</p>${resultsHTML(S.results,true)}<button class="go" data-a="share">📤 Share / save my results</button><p>Tip: bookmark this page too, so you can come back to the results any time.</p><button class="lk" data-a="forget">Join a different session</button></div>`;
    return;
  }
  const jn=(JMAP[st.k]||[])[0];
  let b=jn?`<p class="jl">0${jn} · ${JN[jn-1]}</p>`:'';
  const a=i!==null?me['a'+i]:null;
  if(st.k==='lobby')b+=`<h1>You're in ✓</h1><p>While we wait: what kind of work do you do? At the end we'll show how roles lean across the pillars, but only for groups of ${MIN_GROUP} or more.</p>${roleSelect()}<p>${me.role?'Thanks! ':''}Waiting for the facilitator to start…</p>`;
  if(st.k==='ground')b+=`<h2>Your ${T.g}</h2><p>No scenario yet. Off the top of your head, which pillar matters most to you? This is your baseline for the whole session.</p>${picker('g')}${lockNote()}${me.role?'':rolePrompt()}`;
  if(st.k==='scene')b+=`<h2>${esc(sc.name)}</h2><p>${esc(sc.blurb)}</p><p><b>Which pillar did the facilitators assign you for this scenario?</b> Tap it below. You were assigned it whatever your own view, and that's the point: speak for it as well as you can, and find the others with your pillar.</p>${picker('a'+i)}${lockNote()}`;
  if(st.k==='internal'||st.k==='external'){
    const my=mineAll.filter(x=>x.s===i);
    b+=`<h2>${esc(sc.name)}</h2>`+(a?`<p>${st.k==='internal'?'Huddle with the others assigned your pillar first.':'Now exchange views across the pillars.'} You're speaking for <b style="color:${pn(a).c}">${pn(a).n}</b>. Add the ${T.pt}s you raise, max 5 words each. There's no limit on how many.</p><input id="pt" placeholder="e.g. Saves lives, costs jobs" autocomplete="off"><button class="go" data-a="add">Add</button><p class="err" id="err"></p>${my.length?'<p class="jl">Shared so far</p>':''}<ul>${my.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ul>`:`<p><b>Which pillar were you assigned?</b> Tap it to start adding talking points.</p>${picker('a'+i)}`);
  }
  if(st.k==='reselect')b+=`<h2>${esc(sc.name)}</h2><p>You argued for <b style="color:${a?pn(a).c:'inherit'}">${a?pn(a).n:'—'}</b>. Now, as yourself: after the discussion, where do you stand? You don't have to vote for the pillar you argued.</p>${picker('r'+i)}${lockNote()}`;
  if(st.k==='results')b+=`<h1>Thank you 🙌</h1><p>Your ${T.g}: <b style="color:${me.g?pn(me.g).c:'inherit'}">${me.g?pn(me.g).n:'—'}</b></p><p>Your stance may shift from one scenario to the next, depending on context. Your ${T.g} is what you carry with you.</p><p>Loading the room's results…</p>`;
  W(b);
}

/* ---------- HOST ---------- */
const barH=o=>{const cs=P.map(p=>o[p.id]||0),t=cs.reduce((a,b)=>a+b,0);return `<div class="sb">${P.map((p,j)=>cs[j]?`<span style="width:${cs[j]/t*100}%;background:${p.c}">${cs[j]}</span>`:'').join('')}</div>`};
const barRow=(l,o)=>`<div class="tr"><div class="tl">${esc(l)}</div>${barH(o)}</div>`;
// Value Compass by role. Only aggregated numbers leave this function.
// Rule: a named role is shown only if >= MIN_GROUP people are in it. Smaller ones are folded into "Other / prefer not to say".
// If that leaves 1-2 people in Other, the smallest shown group is folded in too, so a small leftover can't be worked out by subtraction.
function roleLens(){
  const grp={};ROLES.forEach(r=>grp[r.id]=[]);
  players.filter(x=>x.g).forEach(x=>grp[ROLES.some(r=>r.id===x.role)?x.role:'oth'].push(x.g));
  let pool=grp.oth.slice();
  let named=ROLES.filter(r=>r.id!=='oth'&&grp[r.id].length).map(r=>({id:r.id,v:grp[r.id]}));
  named=named.filter(o=>{if(o.v.length>=MIN_GROUP)return true;pool=pool.concat(o.v);return false});
  while(pool.length>0&&pool.length<MIN_GROUP&&named.length){named.sort((a,b)=>a.v.length-b.v.length);pool=pool.concat(named.shift().v)}
  const cg=v=>Object.fromEntries(P.map(p=>[p.id,v.filter(x=>x===p.id).length]));
  const rows=ROLES.filter(r=>named.some(o=>o.id===r.id)).map(r=>({n:r.n,c:cg(named.find(o=>o.id===r.id).v)}));
  if(rows.length&&pool.length>=MIN_GROUP)rows.push({n:ROLES[ROLES.length-1].n,c:cg(pool)});
  return{rows};
}
// Host: turn the live answers into a compact summary that phones can read from the session document.
// Everything is measured against the Value Compass (field g), the baseline.
function buildResults(){
  const cp=k=>Object.fromEntries(P.map(p=>[p.id,cnt(k,p.id)]));
  // movement from the Value Compass to another vote k: m[from][to]
  const mov=k=>Object.fromEntries(P.map(p=>[p.id,Object.fromEntries(P.map(q=>[q.id,players.filter(x=>x.g===p.id&&x[k]===q.id).length]))]));
  // change in percentage points vs the baseline, counting only people who answered both
  const trend=k=>{const mt=players.filter(x=>x.g&&x[k]),n=mt.length,d={};P.forEach(p=>{const b=mt.filter(x=>x.g===p.id).length,v=mt.filter(x=>x[k]===p.id).length;d[p.id]=n?Math.round((v-b)/n*100):0});return{c:cp(k),d,n}};
  // for people assigned a pillar other than their Value Compass: did they adopt the pillar they argued, hold their compass, or move to the third?
  const lens=i=>{const ls=players.filter(x=>x.g&&x['a'+i]&&x['r'+i]&&x['a'+i]!==x.g);return{n:ls.length,adopt:ls.filter(x=>x['r'+i]===x['a'+i]).length,hold:ls.filter(x=>x['r'+i]===x.g).length,third:ls.filter(x=>x['r'+i]!==x['a'+i]&&x['r'+i]!==x.g).length}};
  return{g:cp('g'),roles:roleLens(),trend:[trend('r0'),trend('r1')],
    sc:S.scenarios.map((s,i)=>({i,name:s.name,m:mov('r'+i),lens:lens(i),pts:Object.fromEntries(P.map(p=>[p.id,points.filter(x=>x.s===i&&x.p===p.id).map(x=>x.t)]))}))};
}
// One layout for both the big screen and the phones
function resultsHTML(R,withPts){
  const tot=c=>P.reduce((a,p)=>a+(c[p.id]||0),0);
  const section=(title,sub,boxes,rest)=>`<div class="rs"><h3 class="rh">${title}</h3>${sub?`<p class="rnote">${sub}</p>`:''}${boxes?`<div class="rboxes">${boxes}</div>`:''}${rest||''}</div>`;
  const moveBoxes=m=>P.map(p=>{
    const rows=`<div class="rr" style="color:${p.c}"><span>Remained</span><b>${m[p.id][p.id]}</b></div>`+P.filter(q=>q.id!==p.id).map(q=>`<div class="rr" style="color:${q.c}"><span>To ${q.n}</span><b>${m[p.id][q.id]}</b></div>`).join('');
    return `<div class="rb" style="${pstyle(p)}"><div class="rt">${p.n}</div>${rows}</div>`}).join('');
  const pc=(c,p)=>{const t=tot(c);return t?Math.round((c[p.id]||0)/t*100):0};
  const dl=d=>P.map(p=>`<span style="color:${p.c}">${p.n} ${d[p.id]>0?'▲'+d[p.id]:d[p.id]<0?'▼'+(-d[p.id]):'0'}</span>`).join(' · ');
  const trow=(label,c,line)=>`<div class="tr"><div class="tl">${esc(label)}</div><div>${barH(c)}<div class="dl">${line}</div></div></div>`;
  const tn=R.trend||[];
  const trendSec=section(`${T.g}: the baseline`,`Arrows show the change in percentage points against the ${T.g}, counting only people who answered both.`,'',
    trow(T.g,R.g,P.map(p=>`<span style="color:${p.c}">${p.n} ${pc(R.g,p)}%</span>`).join(' · '))
    +tn.map((t,k)=>trow(`After Scenario ${k+1}`,t.c,dl(t.d))).join(''));
  const segs=[['adopt','#B8A6FF','Adopted the pillar they argued'],['hold','#8EC9FF','Held their Value Compass'],['third','#C9C7E6','Moved to the third pillar']];
  const lensRow=l=>{
    if(!l||!l.n)return '';
    const bar=`<div class="sb">${segs.map(([k,c])=>l[k]?`<span style="width:${l[k]/l.n*100}%;background:${c}">${l[k]}</span>`:'').join('')}</div>`;
    return `<div class="tr"><div class="tl">Assigned a different pillar from their ${T.g} (${l.n})</div><div>${bar}<div class="lg" style="margin:6px 0 0">${segs.map(([k,c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div></div></div>`};
  const scs=R.sc.map((s,n)=>{
    const pts=withPts?`<details class="tp" data-tp="${n}" ${openTp.has(String(n))?'open':''}><summary>Talking points</summary>${P.map(p=>`<div class="tpp" style="color:${p.c}"><b>${p.n}</b><ul>${(s.pts[p.id]||[]).map(t=>`<li>${esc(t)}</li>`).join('')||'<li>—</li>'}</ul></div>`).join('')}</details>`:'';
    return section(`Scenario ${n+1} · ${esc(s.name)}`,`Starting from each person's ${T.g}: who stayed and who moved after the discussion.`,moveBoxes(s.m),lensRow(s.lens)+pts)}).join('');
  const rl=(R.roles&&R.roles.rows)||[];
  const roleSec=R.roles?`<div class="rs"><h3 class="rh">Role lens</h3>${rl.length?`<p class="rnote">${T.g} by role. Groups of fewer than ${MIN_GROUP} people are combined, so nobody can be picked out.</p>${barRow('Whole room ('+tot(R.g)+')',R.g)}${rl.map(r=>barRow(`${r.n} (${tot(r.c)})`,r.c)).join('')}<p class="rnote">Which pillar does your role pull you towards, and who in your world pulls the other way?</p>`:`<p class="rnote">Not enough people per role (minimum ${MIN_GROUP}) to show a breakdown for this room.</p>`}</div>`:'';
  return `<div class="lg">${P.map(p=>`<span><i style="background:${p.c}"></i>${p.n}</span>`).join('')}</div>`+trendSec+scs+roleSec;
}
function resultsText(){
  const R=S.results,link=location.origin+location.pathname+'?s='+code;
  const tot=c=>P.reduce((a,p)=>a+(c[p.id]||0),0);
  const pcs=c=>P.map(p=>`${p.n} ${tot(c)?Math.round((c[p.id]||0)/tot(c)*100):0}%`).join(' · ');
  const sc=R.sc.map((s,n)=>{
    const a=me['a'+s.i],r=me['r'+s.i];
    const mine=(a&&r)?`I argued: ${pn(a).n} · I voted: ${pn(r).n}\n`:'';
    const mv=P.map(p=>`  ${p.n}: ${s.m[p.id][p.id]} remained`+P.filter(q=>q.id!==p.id).map(q=>`, ${s.m[p.id][q.id]} to ${q.n}`).join('')).join('\n');
    const pts=P.map(p=>`  ${p.n}: ${(s.pts[p.id]||[]).join('; ')||'—'}`).join('\n');
    return `SCENARIO ${n+1} · ${s.name}\n${mine}How the room moved from its ${T.g}:\n${mv}\nTalking points:\n${pts}`;
  }).join('\n\n');
  const trendTxt=`ROOM TREND\n  ${T.g}: ${pcs(R.g)}\n`+(R.trend||[]).map((t,k)=>`  After Scenario ${k+1}: ${pcs(t.c)}`).join('\n');
  const rl=(R.roles&&R.roles.rows)||[];
  const roleTxt=rl.length?`\n\nROLE LENS (${T.g} by role; groups under ${MIN_GROUP} are combined)\n`+rl.map(r=>`  ${r.n} (${tot(r.c)}): ${P.map(p=>`${p.n} ${r.c[p.id]||0}`).join(' · ')}`).join('\n'):'';
  return `THE AI TRILEMMA · my results\nMy ${T.g}: ${me.g?pn(me.g).n:'—'}\n\n${trendTxt}\n\n${sc}${roleTxt}\n\nSee the full results again any time: ${link}`;
}
function maybePublish(){
  if(cur().k!=='results'){pubStep=-1;return}
  if(!plLoaded||!ptLoaded||pubStep===S.step)return;
  pubStep=S.step;updateDoc(sref(code),{results:buildResults()});
}
const box=(l,n,base)=>`<div class="sec"><small>${l}</small><div class="num">${n}${base!=null&&n!==base?`<span class="d">${n>base?'▲':'▼'}${Math.abs(n-base)}</span>`:''}</div></div>`;
const hid=l=>`<div class="sec"><small>${l}</small><div class="num" style="opacity:.3">—</div></div>`;
function hostSetup(){
  app.innerHTML=`<div class="wrap"><h1>Facilitator</h1><p>Create a session</p><input id="pin" placeholder="Choose a host PIN"><textarea id="sc" rows="5">${DEF}</textarea><p>Exactly 2 scenarios, one per line: Name | one-line reminder. The full scenario stays on your slides.</p><button class="go" data-a="create">Create session</button><hr style="border-color:rgba(255,255,255,.2);margin:26px 0"><p>Resume a session</p><input id="rc" placeholder="Code" value="${localStorage.hostCode||''}"><input id="rp" placeholder="PIN"><button class="go" data-a="resume">Resume</button></div>`;
}
function drawHost(){
  if(!code)return hostSetup();
  if(!loaded){app.innerHTML='<div class="wrap"><p>Connecting…</p></div>';return}
  if(!S){code=null;return hostSetup()}
  if(S.step!==lastStep){lastStep=S.step;tab=null;lockSent=-1}
  timerEnd=S.deadline||0;
  const c=cur();
  maybePublish();
  const auto=({lobby:'g',ground:'g',results:'r'})[c.k]||('s'+c.n),v=tab||auto;
  const key={lobby:'role',ground:'g',scene:'a'+c.n,reselect:'r'+c.n}[c.k];
  const ans=key?` · ${players.filter(x=>x[key]).length}/${players.length} ${c.k==='scene'?'picked a pillar':'answered'}`:'';
  const tabs=[['g',T.g],['s0','S1'],['s1','S2'],['r','Results']];
  const idxOf=(k,n)=>STEPS.findIndex(x=>x.k===k&&(n===undefined||x.n===n));
  let body='';
  if(v==='r'){
    body=resultsHTML(buildResults(),true);
  }else{
    const showAfter=v[0]==='s'&&S.step>=idxOf('reselect',+v.slice(1));
    const colsH=P.map(p=>{let top,mid='',bot='';const base=cnt('g',p.id);
      if(v==='g')top=box(T.g,base);
      else{const i=+v.slice(1);top=box(T.as,cnt('a'+i,p.id));
        mid=`<ul>${points.filter(x=>x.s===i&&x.p===p.id).map(x=>`<li>${esc(x.t)}</li>`).join('')}</ul>`;
        bot=showAfter?box(`${T.a} · change vs ${T.g}`,cnt('r'+i,p.id),base):hid(T.a)}
      return `<div class="col" style="${pstyle(p)}"><h3>${p.n}</h3>${top}<div class="sec mid">${mid}</div>${bot}</div>`}).join('');
    const head=v[0]==='s'?`<h2>${esc(S.scenarios[+v.slice(1)].name)}</h2>`:'';
    body=`${head}<div class="cols">${colsH}</div>`;
  }
  const endedBanner=S.ended?'<div class="mv" style="border-color:#ffb3b3;margin:0 0 14px">This session has ended — participants see a thank-you screen. You can still browse results below, reopen it, or reset it for a fresh test.</div>':'';
  const jmap=JMAP[c.k]||[];
  app.innerHTML=`<div class="wrap wide">${hide?'<button data-a="hide" style="float:right">Controls</button>':`<div class="bar"><div><b>Code ${code}</b><span>· ${esc(location.host+location.pathname)}?s=${code}</span><span>· ${players.length} joined</span></div>
   <div><b>${lab(c)}</b><span>${ans}</span><b id="tm"></b>${MINS[c.k]?'<button data-a="extend">+1 min</button>':''}<button data-a="prev">‹ Back</button><button data-a="next">Next ›</button>${c.k==='results'?'<button data-a="publish">↻ Update phones</button>':''}<button data-a="hide">Hide</button><button data-a="reset">↺ Reset</button><button data-a="end">${S.ended?'Reopen':'⏹ End'}</button></div></div>`}
   <div class="jn">${JN.map((t,j)=>`<span class="${jmap.includes(j+1)?'on':''}">0${j+1} ${t}</span>`).join('')}</div>
   ${hide?'':`<div class="bar tabs"><div>${tabs.map(([k,l])=>`<button data-tab="${k}" class="${v===k?'on':''}">${l}</button>`).join('')}</div></div>`}
   ${endedBanner}${c.k==='lobby'?'<div class="qr" id="qr"></div>':''}${body}</div>`;
  if(c.k==='lobby'&&window.QRCode)new QRCode($('#qr'),{text:location.origin+location.pathname+'?s='+code,width:220,height:220});
}
setInterval(()=>{
  // Host only: at 0:00 write the lock into the session so every phone locks at the same moment
  if(host&&S&&code&&S.deadline&&Date.now()>=S.deadline&&LOCKABLE.includes(cur().k)&&S.lockedStep!==S.step&&lockSent!==S.step){lockSent=S.step;updateDoc(sref(code),{lockedStep:S.step})}
  const e=$('#tm');if(!e)return;
  if(!timerEnd){e.textContent='';return}
  const s=Math.max(0,Math.round((timerEnd-Date.now())/1000));
  e.textContent=(S&&locked()?'🔒 ':'⏱ ')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
},1000);

/* ---------- EVENTS ---------- */
app.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.tp!==undefined){d.open?openTp.add(d.dataset.tp):openTp.delete(d.dataset.tp)}},true);
app.addEventListener('change',e=>{if(e.target.id==='role'&&e.target.value){me.role=e.target.value;setDoc(doc(db,'sessions',code,'players',pid),{role:me.role},{merge:true});draw()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pt'){const b=$('button[data-a="add"]');if(b)b.click()}});
app.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.set){if(locked())return;const[k,v]=t.dataset.set.split(':');me[k]=v;setDoc(doc(db,'sessions',code,'players',pid),{[k]:v},{merge:true});return draw()}
  if(t.dataset.tab){tab=t.dataset.tab;return draw()}
  const a=t.dataset.a;
  if(a==='join'){const c=$('#cd').value.trim().toUpperCase();if(c)listen(c)}
  if(a==='add'){const x=$('#pt').value.trim().replace(/\s+/g,' ');
    const i=cur().n,pl=me['a'+i];
    if(!pl){$('#err').textContent='Your pillar is still being assigned…';return}
    if(!x||x.split(' ').length>5||x.length>60){$('#err').textContent='Keep it to 5 words or fewer.';return}
    addDoc(collection(db,'sessions',code,'points'),{s:i,p:pl,t:x,pid,at:Date.now()})}
  if(a==='hide'){hide=!hide;draw()}
  if(a==='publish'){updateDoc(sref(code),{results:buildResults()});t.textContent='✓ Sent'}
  if(a==='share'){
    const text=resultsText();
    try{if(!navigator.share)throw 0;await navigator.share({title:'The AI Trilemma – my results',text})}
    catch(err){
      if(err&&err.name==='AbortError')return;
      const u=URL.createObjectURL(new Blob([text],{type:'text/plain'})),l=document.createElement('a');
      l.href=u;l.download='ai-trilemma-results.txt';document.body.appendChild(l);l.click();l.remove();URL.revokeObjectURL(u);
    }
  }
  if(a==='forget'){localStorage.removeItem('lastCode');location.href=location.pathname}
  if(a==='end'){
    if(S.ended){updateDoc(sref(code),{ended:false});return}
    if(confirm('End this session for everyone now? Participants will see a thank-you screen. All answers and points stay saved so you can keep reviewing the results.'))updateDoc(sref(code),{ended:true});
  }
  if(a==='reset'){
    if(!confirm('Clear all answers and points and restart from the lobby? The same code and PIN keep working — this is meant for re-running tests.'))return;
    t.disabled=true;
    const[pd,xd]=await Promise.all([getDocs(collection(db,'sessions',code,'players')),getDocs(collection(db,'sessions',code,'points'))]);
    await Promise.all([...pd.docs,...xd.docs].map(d=>deleteDoc(d.ref)));
    await updateDoc(sref(code),{step:0,ended:false,results:deleteField(),lockedStep:deleteField(),deadline:deleteField()});
    lockSent=-1;tab=null;
  }
  if(a==='extend'){lockSent=-1;updateDoc(sref(code),{deadline:Math.max(Date.now(),S.deadline||0)+60000,lockedStep:deleteField()})}
  if(a==='next'&&S.step<STEPS.length-1)updateDoc(sref(code),stepUpdate(S.step+1));
  if(a==='prev'&&S.step>0)updateDoc(sref(code),stepUpdate(S.step-1));
  if(a==='create'){const pin=$('#pin').value.trim();if(pin.length<3)return alert('Choose a PIN (3+ characters)');
    const sc=$('#sc').value.split('\n').map(l=>l.split('|')).filter(x=>x[0].trim()).map(x=>({name:x[0].trim(),blurb:x.slice(1).join('|').trim()}));
    if(sc.length!==2)return alert('Please provide exactly 2 scenarios, one per line.');
    const c=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');
    await setDoc(sref(c),{step:0,ended:false,scenarios:sc,pin:await sha(pin),created:Date.now()});localStorage.hostCode=c;listen(c)}
  if(a==='resume'){const c=$('#rc').value.trim().toUpperCase(),d=await getDoc(sref(c));
    if(!d.exists()||d.data().pin!==await sha($('#rp').value.trim()))return alert('Code or PIN not recognised');
    localStorage.hostCode=c;listen(c)}
});

const q=new URLSearchParams(location.search).get('s')||(!host&&localStorage.lastCode);
if(q&&!host)listen(String(q).toUpperCase());else draw();
</script></body></html>
